<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI NPC 聊天 — 记忆系统 Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e; color: #e0e0e0; height: 100vh;
            display: flex; flex-direction: column;
        }
        .header {
            background: #16213e; padding: 10px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #0f3460; flex-shrink: 0;
        }
        .header h1 { font-size: 16px; color: #e94560; }
        .header .identity-bar { display: flex; align-items: center; gap: 8px; }
        .header select {
            padding: 4px 8px; border-radius: 6px; border: 1px solid #0f3460;
            background: #1a1a2e; color: #e0e0e0; font-size: 12px; outline: none;
        }
        .header button {
            padding: 4px 10px; border-radius: 6px; border: 1px solid #0f3460;
            background: #1a1a2e; color: #e0e0e0; font-size: 11px; cursor: pointer;
        }
        .header button:hover { background: #0f3460; }
        .header .info { font-size: 11px; color: #888; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .chat-area {
            flex: 1; display: flex; flex-direction: column;
            max-width: 800px; margin: 0 auto; width: 100%;
        }
        .messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.7; word-break: break-word; }
        .msg.user { align-self: flex-end; background: #0f3460; }
        .msg.npc { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; }
        .msg .label { font-size: 11px; color: #888; margin-bottom: 4px; }
        .msg .meta { font-size: 10px; color: #555; margin-top: 6px; }
        .msg .content { font-size: 14px; }
        /* Markdown 内样式 */
        .msg .content h2 { font-size: 15px; color: #e94560; margin: 8px 0 4px; border-bottom: 1px solid #0f3460; padding-bottom: 3px; }
        .msg .content h3 { font-size: 14px; color: #e0e0e0; margin: 6px 0 3px; }
        .msg .content ul, .msg .content ol { padding-left: 20px; margin: 4px 0; }
        .msg .content li { margin: 2px 0; }
        .msg .content strong { color: #e94560; }
        .msg .content blockquote {
            border-left: 3px solid #e94560; padding-left: 10px;
            margin: 6px 0; color: #aaa; font-style: italic;
        }
        .msg .content code {
            background: #0f3460; padding: 1px 5px; border-radius: 3px;
            font-size: 12px; color: #e94560;
        }
        .msg .content hr { border: none; border-top: 1px solid #0f3460; margin: 8px 0; }
        .msg .content p { margin: 4px 0; }
        .msg .content a { color: #e94560; text-decoration: underline; }
        /* 搜索结果块 */
        .msg .search-block {
            margin-top: 8px; border: 1px solid #0f3460; border-radius: 8px;
            background: #1a1a2e; overflow: hidden;
        }
        .msg .search-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 10px; cursor: pointer; user-select: none;
        }
        .msg .search-toggle:hover { background: #0f3460; }
        .msg .search-count { font-size: 11px; color: #58a6ff; }
        .msg .search-arrow { font-size: 11px; color: #888; transition: transform 0.2s; }
        .msg .search-block.open .search-arrow { transform: rotate(180deg); }
        .msg .search-links {
            display: none; padding: 4px 10px 8px; border-top: 1px solid #0f3460;
        }
        .msg .search-block.open .search-links { display: block; }
        .msg .search-item { padding: 4px 0; }
        .msg .search-item a { font-size: 12px; color: #58a6ff; text-decoration: none; }
        .msg .search-item a:hover { text-decoration: underline; }
        .msg .search-snippet { font-size: 11px; color: #8b949e; margin-top: 1px; }
        .input-area {
            padding: 12px 20px; background: #16213e;
            display: flex; gap: 10px; border-top: 1px solid #0f3460; flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 10px 14px; border-radius: 8px;
            border: 1px solid #0f3460; background: #1a1a2e; color: #e0e0e0;
            font-size: 14px; outline: none;
        }
        .input-area input:focus { border-color: #e94560; }
        .input-area button {
            padding: 10px 16px; border-radius: 8px; border: none;
            background: #e94560; color: white; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .input-area button:hover { background: #c73a52; }
        .input-area button:disabled { background: #555; cursor: not-allowed; }
        .sidebar {
            width: 300px; background: #16213e; padding: 14px;
            border-left: 1px solid #0f3460; overflow-y: auto; font-size: 12px;
            display: flex; flex-direction: column;
        }
        .sidebar h3 { color: #e94560; margin-bottom: 10px; font-size: 13px; }
        .sidebar .stat { display: flex; justify-content: space-between; padding: 3px 0; color: #aaa; }
        .sidebar .stat .val { color: #e0e0e0; }
        .sidebar .section { margin-top: 14px; }
        .sidebar input, .sidebar textarea {
            width: 100%; padding: 6px 8px; margin-top: 4px; border-radius: 6px;
            border: 1px solid #0f3460; background: #1a1a2e; color: #e0e0e0;
            font-size: 11px; outline: none; resize: vertical;
        }
        .sidebar textarea { min-height: 60px; }
        .sidebar button.action {
            width: 100%; margin-top: 8px; padding: 6px;
            border-radius: 6px; border: 1px solid #0f3460;
            background: #1a1a2e; color: #e0e0e0; cursor: pointer; font-size: 11px;
        }
        .sidebar button.action:hover { background: #0f3460; }
        .sidebar .danger { border-color: #e94560 !important; color: #e94560 !important; }
        .sidebar .debug {
            margin-top: 10px; padding: 8px; background: #1a1a2e; border-radius: 6px;
            max-height: 200px; overflow-y: auto; font-family: monospace;
            font-size: 10px; color: #888; white-space: pre-wrap; word-break: break-all;
        }
        .history-list {
            flex: 1; overflow-y: auto; margin-top: 10px;
            max-height: 300px;
        }
        .history-item {
            padding: 6px 8px; margin: 3px 0; border-radius: 6px;
            background: #1a1a2e; cursor: pointer; font-size: 11px;
            border-left: 3px solid transparent;
        }
        .history-item:hover { border-left-color: #e94560; background: #0f3460; }
        .history-item .h-role { font-weight: bold; color: #e94560; }
        .history-item .h-time { color: #555; font-size: 10px; }
        .history-item .h-preview { color: #aaa; margin-top: 2px; }
        .loading {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid #333; border-top: 2px solid #e94560;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* 剪贴板确认弹窗 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.6); align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #16213e; border: 1px solid #0f3460; border-radius: 10px;
            padding: 20px; max-width: 480px; width: 90%; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .modal-box h3 { color: #e94560; margin: 0 0 10px; font-size: 14px; }
        .modal-box p { color: #aaa; font-size: 12px; line-height: 1.6; margin: 0 0 10px; word-break: break-all; }
        .modal-box .modal-reason { color: #e94560; background: #1a1a2e; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 14px; }
        .modal-box .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-box .modal-btns button { padding: 8px 16px; border-radius: 6px; border: 1px solid #0f3460; cursor: pointer; font-size: 12px; }
        .modal-box .btn-cancel { background: #1a1a2e; color: #aaa; }
        .modal-box .btn-confirm { background: #e94560; color: #fff; border-color: #e94560; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 10px; }
        .tab-bar button {
            flex: 1; padding: 4px 8px; border-radius: 6px; border: 1px solid #0f3460;
            background: #1a1a2e; color: #e0e0e0; cursor: pointer; font-size: 11px;
        }
        .tab-bar button.active { background: #e94560; border-color: #e94560; }

        /* ============ 移动端（安卓/窄屏）============ */
        .mobile-chrome { display: none; }
        @media (max-width: 768px) {
            .sidebar, .header, .main { display: none; }
            .mobile-chrome { display: flex; flex-direction: column; height: 100vh; }
            .m-top {
                display: flex; align-items: center; gap: 10px;
                padding: 12px 14px 8px; flex-shrink: 0;
                background: #16213e; border-bottom: 1px solid #0f3460;
            }
            .m-top .m-logo { font-size: 15px; color: #e94560; font-weight: bold; white-space: nowrap; }
            .m-trace { margin-left: auto; white-space: nowrap; font-size: 11px;
                padding: 5px 10px; border-radius: 16px; border: 1px solid #0f3460;
                background: #1a1a2e; color: #58a6ff; cursor: pointer; text-decoration: none; }
            .m-npc-bar { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px 10px; flex-shrink: 0;
                background: #16213e; scrollbar-width: thin; }
            .m-npc-bar::-webkit-scrollbar { height: 4px; }
            .m-npc-bar::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 4px; }
            .m-npc-chip { white-space: nowrap; padding: 6px 14px; border-radius: 18px;
                border: 1px solid #0f3460; background: #1a1a2e; color: #e0e0e0;
                font-size: 13px; cursor: pointer; }
            .m-npc-chip.active { background: #e94560; border-color: #e94560; color: #fff; }
            .m-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
            .m-msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.7; word-break: break-word; font-size: 14px; }
            .m-msg.user { align-self: flex-end; background: #0f3460; border-bottom-right-radius: 4px; }
            .m-msg.npc { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; border-bottom-left-radius: 4px; }
            .m-msg .lbl { font-size: 10px; color: #888; margin-bottom: 4px; }
            .m-msg .meta { font-size: 10px; color: #555; margin-top: 6px; }
            .m-msg .content h2, .m-msg .content h3 { font-size: 14px; color: #e94560; margin: 6px 0 3px; }
            .m-msg .content ul, .m-msg .content ol { padding-left: 18px; margin: 4px 0; }
            .m-msg .content blockquote { border-left: 3px solid #e94560; padding-left: 8px; margin: 6px 0; color: #aaa; }
            .m-msg .content strong { color: #e94560; }
            .m-input-bar { display: flex; align-items: flex-end; gap: 10px; padding: 10px 14px 14px;
                background: #16213e; border-top: 1px solid #0f3460; flex-shrink: 0; }
            .m-input-bar input { flex: 1; padding: 11px 16px; border-radius: 22px;
                border: 1px solid #0f3460; background: #1a1a2e; color: #e0e0e0;
                font-size: 14px; outline: none; }
            .m-input-bar input:focus { border-color: #e94560; }
            .m-input-bar .m-send { width: 44px; height: 44px; border-radius: 50%; border: none;
                background: #e94560; color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; }
            .m-input-bar .m-send:disabled { background: #555; }
            .m-add { margin-left: auto; }
        }
    </style>
</head>
<body>

<!-- ============ 移动端界面（安卓/窄屏，豆包风格） ============ -->
<div class="mobile-chrome" id="mobileChrome">
    <div class="m-top">
        <span class="m-logo">AI NPC</span>
        <a class="m-trace" href="/trace">追踪</a>
    </div>
    <div class="m-npc-bar" id="mNpcBar"></div>
    <div class="m-messages" id="mMessages">
        <div class="m-msg npc"><div class="content">你好！我是默认NPC。</div></div>
    </div>
    <div class="m-input-bar">
        <input id="mInput" type="text" placeholder="和大模型聊聊天..." onkeydown="if(event.key==='Enter') mSend()" />
        <button class="m-send" id="mSendBtn" onclick="mSend()">➤</button>
    </div>
</div>

<div class="header">
    <h1>AI NPC 记忆系统</h1>
    <div class="identity-bar">
        <select id="identitySelect" onchange="switchIdentity()">
            <option value="default">默认NPC</option>
        </select>
        <button onclick="showCreateForm()">+ 新身份</button>
    </div>
    <span class="info" id="headerInfo">就绪</span>
</div>

<div class="main">
    <div class="chat-area">
        <div class="messages" id="messages">
            <div class="msg npc">
                <div class="label">NPC</div>
                <div class="content">你好！我是默认NPC。有什么想聊的吗？</div>
            </div>
        </div>
        <div class="input-area">
            <input id="input" type="text" placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMsg()" autofocus />
            <button id="sendBtn" onclick="sendMsg()">发送</button>
            <button onclick="clearChat()" style="background:#555;">清空</button>
        </div>
    </div>

    <!-- 剪贴板确认弹窗 -->
    <div class="modal-overlay" id="clipboardModal">
        <div class="modal-box">
            <h3>⚠️ 疑似粘贴剪贴板内容</h3>
            <div class="modal-reason" id="clipboardReason"></div>
            <p>你输入的消息与系统剪贴板中的内容高度相似，可能是误粘贴了无关内容。<br/>确认要发送这条消息吗？</p>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="cancelClipboardSend()">取消</button>
                <button class="btn-confirm" onclick="confirmClipboardSend()">仍要发送</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="tab-bar">
            <button class="active" onclick="switchTab('stats')">统计</button>
            <button onclick="switchTab('history')">历史记录</button>
            <button onclick="switchTab('debug')">调试</button>
        </div>

        <!-- 统计面板 -->
        <div id="tab-stats">
            <h3>记忆库统计</h3>
            <div class="stat"><span>总记忆</span><span class="val" id="statTotal">-</span></div>
            <div class="stat"><span>核心</span><span class="val" id="statCore">-</span></div>
            <div class="stat"><span>情景</span><span class="val" id="statEpisodic">-</span></div>
            <div class="stat"><span>工作</span><span class="val" id="statWorking">-</span></div>
            <button class="action" onclick="refreshStats()">刷新统计</button>

            <div class="section" id="createForm" style="display:none;">
                <h3>创建新身份</h3>
                <input id="newName" placeholder="身份名称（如：艾琳）" />
                <input id="newPersona" placeholder="性格（如：温和善良）" />
                <textarea id="newWorld" placeholder="世界观（可选）"></textarea>
                <textarea id="newMemories" placeholder="核心记忆，每行一条（可选）"></textarea>
                <button class="action" onclick="createIdentity()">创建</button>
                <button class="action danger" onclick="hideCreateForm()">取消</button>
            </div>

            <div class="section" id="npcStateBox">
                <h3>角色当前状态</h3>
                <textarea id="npcStateInput" placeholder="填写该角色当前的状态（如：可莉现在在禁闭室）。保存后后续对话会参考，重启仍在。"></textarea>
                <button class="action" onclick="saveNpcState()">保存状态</button>
            </div>

            <div class="section">
                <h3>当前身份操作</h3>
                <button class="action" onclick="initIdentity()">初始化记忆</button>
                <button class="action danger" onclick="deleteIdentity()">删除当前身份</button>
                <button class="action" onclick="exportRolepack()">导出角色包</button>
                <button class="action" onclick="document.getElementById('rolepackFile').click()">导入角色包</button>
                <input type="file" id="rolepackFile" accept=".zip" style="display:none" onchange="importRolepack(this)" />
            </div>
        </div>

        <!-- 历史记录面板 -->
        <div id="tab-history" style="display:none;">
            <h3>对话历史</h3>
            <button class="action" onclick="loadHistory()">刷新历史</button>
            <div class="history-list" id="historyList">
                <div style="color:#888;text-align:center;padding:20px;">点击「刷新历史」加载</div>
            </div>
        </div>

        <!-- 调试面板 -->
        <div id="tab-debug" style="display:none;">
            <h3>调试信息</h3>
            <div class="debug" id="debugInfo">等待对话...</div>
        </div>
    </div>
</div>

<script>
let loading = false;
let currentIdentity = "default";

// 初始化 marked
marked.setOptions({ breaks: true, gfm: true });

// ==================== 标签页切换 ====================

function switchTab(tab) {
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    document.querySelector(`.tab-bar button[onclick*="${tab}"]`).classList.add('active');
    document.getElementById('tab-stats').style.display = tab === 'stats' ? '' : 'none';
    document.getElementById('tab-history').style.display = tab === 'history' ? '' : 'none';
    document.getElementById('tab-debug').style.display = tab === 'debug' ? '' : 'none';
    if (tab === 'history') loadHistory();
    if (tab === 'stats') refreshStats();
}

// ==================== 身份管理 ====================

async function loadIdentities() {
    const resp = await fetch('/api/identities');
    const data = await resp.json();
    currentIdentity = data.current;
    const sel = document.getElementById('identitySelect');
    sel.innerHTML = '';
    for (const [name, info] of Object.entries(data.identities)) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = info.persona?.name || name;
        if (name === currentIdentity) opt.selected = true;
        sel.appendChild(opt);
    }
    // 移动端 NPC 胶囊栏
    renderMobileNpcBar(data.identities, currentIdentity);
}

async function switchIdentity() {
    const name = document.getElementById('identitySelect').value;
    const resp = await fetch('/api/switch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: name })
    });
    const data = await resp.json();
    if (data.status === 'ok') {
        currentIdentity = data.current;
        // 加载该身份的聊天历史；无历史时显示欢迎语
        const loaded = await loadChatHistory();
        if (!loaded) {
            document.getElementById('messages').innerHTML = '';
            addMsg('npc', `已切换到「${currentIdentity}」。有什么想聊的吗？`);
        }
        refreshStats();
        loadHistory();
        loadNpcState();
    }
}

// ==================== 角色当前状态 ====================

async function loadNpcState() {
    try {
        const resp = await fetch('/api/npc_state?identity=' + currentIdentity);
        const data = await resp.json();
        document.getElementById('npcStateInput').value = data.state || '';
    } catch (e) {
        // 静默失败，不影响主流程
    }
}

async function saveNpcState() {
    const stateText = document.getElementById('npcStateInput').value;
    const resp = await fetch('/api/npc_state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: currentIdentity, state: stateText })
    });
    const data = await resp.json();
    if (data.status === 'ok') {
        alert('状态已保存' + (data.state ? '' : '（已清空）'));
    } else {
        alert('保存失败');
    }
}

function showCreateForm() {
    document.getElementById('createForm').style.display = 'block';
    document.getElementById('newName').focus();
}

function hideCreateForm() {
    document.getElementById('createForm').style.display = 'none';
}

async function createIdentity() {
    const name = document.getElementById('newName').value.trim();
    const personality = document.getElementById('newPersona').value.trim();
    const world = document.getElementById('newWorld').value.trim();
    const memoriesText = document.getElementById('newMemories').value.trim();

    if (!name) { alert('请输入身份名称'); return; }

    const core_memories = memoriesText
        ? memoriesText.split('\n').filter(l => l.trim()).map(l => ({
            content: l.trim(),
            summary: l.trim().slice(0, 40),
            keywords: []
        }))
        : [];

    const resp = await fetch('/api/identities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, persona: { name, personality: personality || '友好', world_setting: world || '' }, core_memories })
    });
    const data = await resp.json();
    if (data.error) { alert(data.error); return; }

    hideCreateForm();
    ['newName','newPersona','newWorld','newMemories'].forEach(id => document.getElementById(id).value = '');
    await loadIdentities();
    await switchIdentityById(name);
}

async function switchIdentityById(name) {
    await fetch('/api/switch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: name })
    });
    currentIdentity = name;
    // 移动端同步高亮、PC 同步下拉框
    renderMobileNpcBar2(name);
    const sel = document.getElementById('identitySelect');
    if (sel) sel.value = name;
    // 加载该身份的聊天历史；无历史时显示欢迎语
    const loaded = await loadChatHistory();
    if (!loaded) {
        if (isMobile()) {
            document.getElementById('mMessages').innerHTML = '';
            mAddMsg('npc', `我是「${name}」。有什么想聊的吗？`);
        } else {
            document.getElementById('messages').innerHTML = '';
            addMsg('npc', `我是「${name}」。有什么想聊的吗？`);
        }
    }
    refreshStats();
    loadHistory();
}

// 仅刷新胶囊高亮（不进 /api/switch，避免重复请求）
function renderMobileNpcBar2(current) {
    const bar = document.getElementById('mNpcBar');
    if (!bar) return;
    bar.querySelectorAll('.m-npc-chip').forEach(c => c.classList.toggle('active', c.textContent === current));
}

async function deleteIdentity() {
    if (currentIdentity === 'default') { alert('不能删除默认身份'); return; }
    if (!confirm(`确定删除身份「${currentIdentity}」及其所有记忆？`)) return;
    const resp = await fetch(`/api/identities/${currentIdentity}`, { method: 'DELETE' });
    const data = await resp.json();
    if (data.error) { alert(data.error); return; }
    await loadIdentities();
    document.getElementById('messages').innerHTML = '';
    addMsg('npc', '身份已删除，已切换回默认NPC。');
    refreshStats();
}

// ==================== 角色包导入/导出 ====================

async function exportRolepack() {
    const resp = await fetch(`/api/rolepack/export?identity=${encodeURIComponent(currentIdentity)}`);
    if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        alert('导出失败：' + (err.error || resp.status));
        return;
    }
    const blob = await resp.blob();
    // 从 Content-Disposition 解析文件名（支持 UTF-8 中文名）
    const cd = resp.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    const name = m ? decodeURIComponent(m[1]) : (currentIdentity + '_rolepack.zip');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
    addMsg('npc', `角色包已导出：${name}，可用于安卓端导入。`);
}

async function importRolepack(input) {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    if (!confirm(`确定导入角色包「${file.name}」？\n若包内身份已存在将导入失败（不会覆盖现有角色）。`)) return;
    const fd = new FormData();
    fd.append('file', file);
    const resp = await fetch('/api/rolepack/import', { method: 'POST', body: fd });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) { alert('导入失败：' + (data.error || resp.status)); return; }
    alert(`导入成功：${data.identity}（记忆文件 ${data.memory_files} 个${data.game_db ? '，含游戏数据库' : ''}）`);
    await loadIdentities();
    await switchIdentityById(data.identity);
    addMsg('npc', `角色包已导入：${data.identity}，可以开始聊天了。`);
}

async function initIdentity() {
    const name = prompt('要初始化哪些核心记忆？每行一条，留空则使用默认：');
    const memories = name
        ? name.split('\n').filter(l => l.trim()).map(l => ({ content: l.trim(), summary: l.trim().slice(0, 40), keywords: [] }))
        : [
            { content: "NPC身份设定：一个友好的游戏角色", summary: "友好NPC", keywords: ["身份", "NPC"] },
            { content: "这个世界的背景：魔法与剑的时代", summary: "世界观", keywords: ["世界观", "魔法", "剑"] }
        ];
    const resp = await fetch('/api/init', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona: { name: currentIdentity, personality: "友好" }, core_memories: memories })
    });
    const data = await resp.json();
    if (data.error) { alert(data.error); return; }
    addMsg('npc', `记忆已初始化！我是「${currentIdentity}」。`);
    refreshStats();
}

// ==================== 对话历史 ====================

// 加载并渲染当前身份的聊天历史（聊天主界面）。
// 规则：
//  1. 只渲染带角色标记（user/npc）的记录，区分是哪个角色说的
//  2. 若历史中存在未标记角色的记录，则放弃它及其更早的全部记录，
//     从现在开始只加载有标记的（新记录一律带标记）
// 返回是否成功渲染了历史（无历史或全部被放弃时返回 false）
async function loadChatHistory() {
    try {
        const resp = await fetch('/api/history?identity=' + currentIdentity);
        const data = await resp.json();
        const history = data.history || [];
        if (history.length === 0) return false;

        // 找到第一条未标记角色的记录：它及其之前的全部放弃
        let startIdx = 0;
        for (let i = 0; i < history.length; i++) {
            const r = history[i];
            if (r.role !== 'user' && r.role !== 'npc') {
                startIdx = i + 1;
                break;
            }
        }
        if (startIdx >= history.length) return false;

        const mobile = isMobile();
        const messages = mobile ? document.getElementById('mMessages') : document.getElementById('messages');
        messages.innerHTML = '';
        let rendered = false;
        for (let i = startIdx; i < history.length; i++) {
            const r = history[i];
            if (r.role !== 'user' && r.role !== 'npc') continue;
            if (mobile) mAddMsg(r.role, r.content, r.mode, false, null, false);
            else addMsg(r.role, r.content, r.mode, false, null, false);
            rendered = true;
        }
        return rendered;
    } catch (e) {
        return false;
    }
}

async function loadHistory() {
    try {
        const resp = await fetch('/api/history?identity=' + currentIdentity);
        const data = await resp.json();
        const list = document.getElementById('historyList');
        if (!data.history || data.history.length === 0) {
            list.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">暂无历史记录</div>';
            return;
        }
        list.innerHTML = data.history.map((r, i) => {
            const role = r.role === 'user' ? '玩家' : 'NPC';
            const preview = r.content.replace(/\n/g, ' ').slice(0, 50);
            const time = r.timestamp ? r.timestamp.slice(11, 19) : '';
            return `<div class="history-item" onclick="scrollToMsg(${i})">
                <span class="h-role">${role}</span>
                <span class="h-time">${time}</span>
                <div class="h-preview">${preview}...</div>
            </div>`;
        }).reverse().join('');
    } catch (e) {}
}

// ==================== 聊天 ====================

// 移动端检测（与 CSS 的 max-width:768px 一致）
function isMobile() { return window.innerWidth <= 768; }

// 移动端 NPC 胶囊渲染（豆包风格：横滑选择 NPC）
function renderMobileNpcBar(identities, current) {
    const bar = document.getElementById('mNpcBar');
    if (!bar) return;
    bar.innerHTML = '';
    for (const [name, info] of Object.entries(identities)) {
        const chip = document.createElement('div');
        chip.className = 'm-npc-chip' + (name === current ? ' active' : '');
        chip.textContent = info.persona?.name || name;
        chip.onclick = () => mSwitchIdentity(name);
        bar.appendChild(chip);
    }
}

async function mSwitchIdentity(name) {
    const resp = await fetch('/api/switch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: name })
    });
    const data = await resp.json();
    if (data.status === 'ok') {
        currentIdentity = data.current;
        document.querySelectorAll('.m-npc-chip').forEach(c => c.classList.remove('active'));
        const chips = document.querySelectorAll('.m-npc-chip');
        for (const c of chips) if (c.textContent === (data.current)) c.classList.add('active');
        const loaded = await loadChatHistory();
        if (!loaded) {
            document.getElementById('mMessages').innerHTML = '';
            mAddMsg('npc', `已切换到「${currentIdentity}」。有什么想聊的吗？`);
        }
    }
}

// 移动端消息渲染（独立于 PC 的 .messages，避免布局冲突）
function mAddMsg(role, text, mode, deepThink, search, scroll = true) {
    const box = document.getElementById('mMessages');
    if (!box) return;
    const div = document.createElement('div');
    div.className = 'm-msg ' + role;
    const label = role === 'user' ? '你' : currentIdentity;
    const rendered = role === 'npc' ? marked.parse(text) : escapeHtml(text);
    div.innerHTML = `<div class="lbl">${label}</div><div class="content">${rendered}</div>`;
    if (role === 'npc' && mode) {
        let meta = mode === 'knowledge' ? '知识模式' : '闲聊模式';
        if (deepThink) meta += ' | 深度思考';
        div.innerHTML += `<div class="meta">${meta}</div>`;
    }
    if (role === 'npc' && search && search.used && search.results && search.results.length > 0) {
        const results = search.results;
        const links = results.map((r, i) => {
            const url = r.url || '#';
            const title = r.title || url;
            return `<div style="font-size:11px;margin-top:2px;"><a href="${url}" target="_blank" style="color:#58a6ff;">${i+1}. ${escapeHtml(title)}</a></div>`;
        }).join('');
        div.innerHTML += `<div style="margin-top:8px;font-size:11px;color:#58a6ff;">🔍 已搜索 ${results.length} 个页面</div><div>${links}</div>`;
    }
    box.appendChild(div);
    if (scroll) div.scrollIntoView({ behavior: 'smooth' });
}

async function mSend() {
    if (loading) return;
    const input = document.getElementById('mInput');
    const msg = input.value.trim();
    if (!msg) return;
    // 剪贴板比对（移动端可选，失败则直接发）
    try {
        const resp = await fetch('/api/check_clipboard', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        const data = await resp.json();
        if (data.suspect) {
            if (confirm(data.reason || '消息与剪贴板内容高度相似，仍要发送吗？')) { mDoSend(msg); }
            return;
        }
    } catch (e) {}
    mDoSend(msg);
}

async function mDoSend(msg) {
    if (loading) return;
    loading = true;
    document.getElementById('mSendBtn').disabled = true;
    mAddMsg('user', msg);
    document.getElementById('mInput').value = '';
    document.getElementById('mInput').focus();
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 180000);
    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, identity: currentIdentity }),
            signal: controller.signal
        });
        const data = await resp.json();
        if (data.error) {
            mAddMsg('npc', '出错了: ' + data.error);
        } else {
            mAddMsg('npc', data.reply, data.mode, data.deep_think_used, data.search);
        }
    } catch (e) {
        if (e.name === 'AbortError') mAddMsg('npc', '请求超时（超过180秒）。可稍后重试。');
        else mAddMsg('npc', '连接失败: ' + e.message);
    } finally {
        clearTimeout(timeoutId);
        loading = false;
        document.getElementById('mSendBtn').disabled = false;
    }
    // 移动端可静默刷新统计；不向移动 UI 暴露调试
}

async function sendMsg() {
    if (loading) return;
    const input = document.getElementById('input');
    const msg = input.value.trim();
    if (!msg) return;

    // 剪贴板比对：若疑似误粘贴，弹窗让玩家确认
    try {
        const resp = await fetch('/api/check_clipboard', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        const data = await resp.json();
        if (data.suspect) {
            document.getElementById('clipboardReason').textContent = data.reason || '消息与剪贴板内容高度相似。';
            document.getElementById('clipboardModal').classList.add('show');
            return; // 等玩家确认后再发
        }
    } catch (e) {
        // 检测失败不阻塞，直接发送
    }
    doSend(msg);
}

function cancelClipboardSend() {
    document.getElementById('clipboardModal').classList.remove('show');
    document.getElementById('input').focus();
}

async function confirmClipboardSend() {
    document.getElementById('clipboardModal').classList.remove('show');
    const input = document.getElementById('input');
    const msg = input.value.trim();
    if (msg) doSend(msg);
}

async function doSend(msg) {
    if (loading) return;
    loading = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('headerInfo').innerHTML = '<span class="loading"></span> 思考中...';

    addMsg('user', msg);
    document.getElementById('input').value = '';
    document.getElementById('input').focus();

    // 超时控制：LLM 深度思考可能较慢，设置 180 秒超时
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 180000);

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, identity: currentIdentity }),
            signal: controller.signal
        });
        const data = await resp.json();
        if (data.error) {
            addMsg('npc', '出错了: ' + data.error);
        } else {
            addMsg('npc', data.reply, data.mode, data.deep_think_used, data.search);
            updateDebug(data.debug);
        }
    } catch (e) {
        if (e.name === 'AbortError') {
            addMsg('npc', '请求超时（超过180秒）。后端可能仍在处理，可稍后重试或刷新页面。');
        } else {
            addMsg('npc', '连接失败: ' + e.message + '（后端可能已重启，请刷新页面）');
        }
    } finally {
        clearTimeout(timeoutId);
        loading = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('headerInfo').textContent = '就绪';
    }
    refreshStats();
}

function addMsg(role, text, mode, deepThink, search, scroll = true) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const label = role === 'user' ? '你' : currentIdentity;
    // 渲染 Markdown
    const rendered = role === 'npc' ? marked.parse(text) : escapeHtml(text);
    div.innerHTML = `<div class="label">${label}</div><div class="content">${rendered}</div>`;
    if (role === 'npc' && mode) {
        let meta = mode === 'knowledge' ? '知识模式' : '闲聊模式';
        if (deepThink) meta += ' | 深度思考';
        div.innerHTML += `<div class="meta">${meta}</div>`;
    }
    // 搜索结果展示（主流模型样式：已搜索 N 个页面，可展开查看链接）
    if (role === 'npc' && search && search.used && search.results && search.results.length > 0) {
        const results = search.results;
        const links = results.map((r, i) => {
            const url = r.url || '#';
            const title = r.title || url;
            return `<div class="search-item">
                <a href="${url}" target="_blank" rel="noopener">${i + 1}. ${escapeHtml(title)}</a>
                <div class="search-snippet">${escapeHtml((r.snippet || '').slice(0, 150))}</div>
            </div>`;
        }).join('');
        const searchHtml = `<div class="search-block">
            <div class="search-toggle" onclick="this.parentElement.classList.toggle('open')">
                <span class="search-count">🔍 已搜索 ${results.length} 个页面</span>
                <span class="search-arrow">▾</span>
            </div>
            <div class="search-links">${links}</div>
        </div>`;
        div.innerHTML += searchHtml;
    }
    document.getElementById('messages').appendChild(div);
    if (scroll) div.scrollIntoView({ behavior: 'smooth' });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
}

function updateDebug(debug) {
    if (!debug) return;
    document.getElementById('debugInfo').textContent = JSON.stringify(debug, null, 2);
}

async function refreshStats() {
    try {
        const resp = await fetch('/api/stats?identity=' + currentIdentity);
        const data = await resp.json();
        document.getElementById('statTotal').textContent = data.total || 0;
        document.getElementById('statCore').textContent = data.core || 0;
        document.getElementById('statEpisodic').textContent = data.episodic || 0;
        document.getElementById('statWorking').textContent = data.working || 0;
    } catch (e) {}
}

async function clearChat() {
    await fetch('/api/clear', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: currentIdentity })
    });
    document.getElementById('messages').innerHTML = '';
    addMsg('npc', '对话已清空。重新开始吧！');
    document.getElementById('debugInfo').textContent = '等待对话...';
    loadHistory();
}

function scrollToMsg(idx) {
    const msgs = document.querySelectorAll('.msg');
    if (idx < msgs.length) {
        msgs[idx].scrollIntoView({ behavior: 'smooth' });
        msgs[idx].style.outline = '2px solid #e94560';
        setTimeout(() => msgs[idx].style.outline = '', 2000);
    }
}

// 页面初始化：加载身份列表后，渲染该身份的聊天历史（无历史时显示欢迎语）
async function initPage() {
    await loadIdentities();
    const loaded = await loadChatHistory();
    if (!loaded) {
        if (isMobile()) {
            document.getElementById('mMessages').innerHTML = '';
            mAddMsg('npc', `你好！我是「${currentIdentity}」。有什么想聊的吗？`);
        } else {
            document.getElementById('messages').innerHTML = '';
            addMsg('npc', `你好！我是「${currentIdentity}」。有什么想聊的吗？`);
        }
    }
    refreshStats();
    loadNpcState();
}

initPage();

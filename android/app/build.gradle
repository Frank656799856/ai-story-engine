plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.forgemind.npc'
    compileSdk 35

    defaultConfig {
        applicationId "com.forgemind.npc"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        // Chaquopy: 仅 arm64-v8a（当前手机 ColorOS 14 = Android 14）配 x86_64 备用模拟器
        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }

        python {
            // 本机仅有 Python 3.13.3；Chaquopy 默认找 3.10 会扑空，显式指定目标版本与本机解释器
            version "3.13"
            buildPython "C:/Users/Administrator/AppData/Local/Programs/Python/Python313/python.exe"
            // 仅打包本机可跑的依赖；ddgs/beautifulsoup4 为搜索功能（已停用），排除瘦身
            // jieba 不经 pip 打包（PyPI 无 wheel，Chaquopy 不支持 sdist）——已作为源码内置 src/main/python/jieba
            pip {
                install "flask"
                install "requests"
            }
        }

        packaging {
            jniLibs {
                useLegacyPackaging = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.3'
}